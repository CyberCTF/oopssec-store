apiVersion: v1
kind: Namespace
metadata:
  name: isoloom-oopssec-store
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: store
  template:
    metadata:
      labels:
        isoloom.com/machine: store
        net.isoloom.com/lab: member
    spec:
      hostname: store
      initContainers:
      - name: isoloom-probe
        image: busybox:1.37.0-musl
        command:
        - /bin/cp
        - /bin/busybox
        - /probe/busybox
        volumeMounts:
        - name: isoloom-probe
          mountPath: /probe
      containers:
      - name: store
        image: isoloom/oopssec-store-store
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        readinessProbe:
          exec:
            command:
            - /.isoloom-probe/busybox
            - sh
            - -c
            - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 3000
          periodSeconds: 5
          failureThreshold: 60
        resources:
          limits:
            cpu: '1'
            memory: 1024Mi
        volumeMounts:
        - name: vol-data
          mountPath: /app/data
        - name: vol-uploads
          mountPath: /app/uploads
        - name: vol-documents
          mountPath: /app/documents
        - name: isoloom-probe
          mountPath: /.isoloom-probe
          readOnly: true
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
      - name: vol-data
        persistentVolumeClaim:
          claimName: store-data
      - name: vol-uploads
        persistentVolumeClaim:
          claimName: store-uploads
      - name: vol-documents
        persistentVolumeClaim:
          claimName: store-documents
      - name: isoloom-probe
        emptyDir: {}
---
