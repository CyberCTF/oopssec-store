    - /isoloom/init/flag.sh
    volumes:
    - ../../ctf/flag.sh:/isoloom/init/flag.sh:ro
    - store-data:/app/data
    - store-uploads:/app/uploads
    - store-documents:/app/documents
    network_mode: service:store
    environment:
      CTF_FLAG_MAIN: ${CTF_FLAG_MAIN:-}
      CTF_FLAG_PUBLIC_ENV_VARIABLE: ${CTF_FLAG_PUBLIC_ENV_VARIABLE:-}
      CTF_FLAG_WEAK_JWT_SECRET: ${CTF_FLAG_WEAK_JWT_SECRET:-}
      CTF_FLAG_CLIENT_SIDE_PRICE_MANIPULATION: ${CTF_FLAG_CLIENT_SIDE_PRICE_MANIPULATION:-}
