# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: oopssec-store
services:
  store:
    build:
      context: ../../app
      labels:
        isoloom.managed: 'true'
        isoloom.environment: oopssec-store
    image: isoloom/oopssec-store-store
    platform: linux/amd64
    hostname: store
    networks:
      lab:
        ipv4_address: 10.60.35.10
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+3000}:3000
    volumes:
    - store-data:/app/data
    - store-uploads:/app/uploads
    - store-documents:/app/documents
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 3000
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
    labels:
      isoloom.service.web: http:3000
      isoloom.managed: 'true'
      isoloom.environment: oopssec-store
    restart: unless-stopped
  store-routes:
    image: alpine:3.20
    network_mode: service:store
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      store:
        condition: service_started
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: oopssec-store
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - -c
    - ip route del default 2>/dev/null; exec sh /isoloom/run.sh
    volumes:
    - ./checks/networks.sh:/isoloom/run.sh:ro
    - ../..:/isoloom/project:ro
    networks:
      lab: null
    user: '0'
    cap_add:
    - NET_ADMIN
    depends_on:
      store:
        condition: service_healthy
      store-routes:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: oopssec-store
  isoloom-check-store:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/store.sh:/isoloom/run.sh:ro
    network_mode: service:store
    depends_on:
      store:
        condition: service_healthy
      store-routes:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: oopssec-store
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    volumes:
    - isoloom-probe-amd64:/probe
    network_mode: none
    restart: no
    labels:
      isoloom.managed: 'true'
      isoloom.environment: oopssec-store
networks:
  lab:
    ipam:
      config:
      - subnet: 10.60.35.0/24
        gateway: 10.60.35.1
    labels:
      isoloom.managed: 'true'
      isoloom.environment: oopssec-store
volumes:
  store-data:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: oopssec-store
  store-uploads:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: oopssec-store
  store-documents:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: oopssec-store
  isoloom-probe-amd64:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: oopssec-store
