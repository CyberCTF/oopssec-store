      CTF_FLAG_INSECURE_PASSWORD_RESET: ${CTF_FLAG_INSECURE_PASSWORD_RESET:-}
      CTF_FLAG_OPEN_REDIRECT: ${CTF_FLAG_OPEN_REDIRECT:-}
      CTF_FLAG_SELF_XSS_PROFILE_INJECTION: ${CTF_FLAG_SELF_XSS_PROFILE_INJECTION:-}
      CTF_FLAG_CSRF_PROFILE_TAKEOVER_CHAIN: ${CTF_FLAG_CSRF_PROFILE_TAKEOVER_CHAIN:-}
      CTF_FLAG_AES_CBC_PADDING_ORACLE: ${CTF_FLAG_AES_CBC_PADDING_ORACLE:-}
      CTF_FLAG_MCP_MALICIOUS_SERVER: ${CTF_FLAG_MCP_MALICIOUS_SERVER:-}
      CTF_FLAG_MIDDLEWARE_AUTHORIZATION_BYPASS: ${CTF_FLAG_MIDDLEWARE_AUTHORIZATION_BYPASS:-}
      CTF_FLAG_RACE_CONDITION_COUPON_ABUSE: ${CTF_FLAG_RACE_CONDITION_COUPON_ABUSE:-}
      CTF_FLAG_INSECURE_RANDOMNESS_GIFT_CARD: ${CTF_FLAG_INSECURE_RANDOMNESS_GIFT_CARD:-}
      CTF_FLAG_NPM_SUPPLY_CHAIN_TYPOSQUAT: ${CTF_FLAG_NPM_SUPPLY_CHAIN_TYPOSQUAT:-}
      CTF_FLAG_AI_RULES_FILE_BACKDOOR: ${CTF_FLAG_AI_RULES_FILE_BACKDOOR:-}
      CTF_FLAG_JWT_ALGORITHM_CONFUSION: ${CTF_FLAG_JWT_ALGORITHM_CONFUSION:-}
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+3000}:3000
    volumes:
    - store-data:/app/data
    - store-uploads:/app/uploads
    - store-documents:/app/documents
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 3000
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
    labels:
      isoloom.service.web: http:3000
      isoloom.managed: 'true'
      isoloom.environment: oopssec-store
    restart: unless-stopped
  store-routes:
    image: alpine:3.20
    network_mode: service:store
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      store:
        condition: service_started
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: oopssec-store
  store-init-1:
