name: oopssec-store
services:
  store:
    build:
      context: ../../app
      dockerfile: ../build/store/Dockerfile
      labels:
        isoloom.managed: 'true'
        isoloom.environment: oopssec-store
    image: isoloom/oopssec-store-store
    platform: linux/amd64
    hostname: store
    networks:
      lab:
        ipv4_address: 10.60.35.10
    environment:
      CTF_FLAG_MAIN: ${CTF_FLAG_MAIN:-}
      CTF_FLAG_PUBLIC_ENV_VARIABLE: ${CTF_FLAG_PUBLIC_ENV_VARIABLE:-}
      CTF_FLAG_WEAK_JWT_SECRET: ${CTF_FLAG_WEAK_JWT_SECRET:-}
