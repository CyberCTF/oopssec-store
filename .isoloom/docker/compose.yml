      CTF_FLAG_SERVER_SIDE_REQUEST_FORGERY: ${CTF_FLAG_SERVER_SIDE_REQUEST_FORGERY:-}
      CTF_FLAG_SQL_INJECTION: ${CTF_FLAG_SQL_INJECTION:-}
      CTF_FLAG_INFORMATION_DISCLOSURE_API_ERROR: ${CTF_FLAG_INFORMATION_DISCLOSURE_API_ERROR:-}
      CTF_FLAG_MALICIOUS_FILE_UPLOAD: ${CTF_FLAG_MALICIOUS_FILE_UPLOAD:-}
      CTF_FLAG_PRODUCT_SEARCH_SQL_INJECTION: ${CTF_FLAG_PRODUCT_SEARCH_SQL_INJECTION:-}
      CTF_FLAG_SESSION_FIXATION_WEAK_SESSION_MANAGEMENT: ${CTF_FLAG_SESSION_FIXATION_WEAK_SESSION_MANAGEMENT:-}
      CTF_FLAG_BRUTE_FORCE_NO_RATE_LIMITING: ${CTF_FLAG_BRUTE_FORCE_NO_RATE_LIMITING:-}
      CTF_FLAG_X_FORWARDED_FOR_SQL_INJECTION: ${CTF_FLAG_X_FORWARDED_FOR_SQL_INJECTION:-}
      CTF_FLAG_PROMPT_INJECTION_AI_ASSISTANT: ${CTF_FLAG_PROMPT_INJECTION_AI_ASSISTANT:-}
      CTF_FLAG_BROKEN_OBJECT_LEVEL_AUTHORIZATION: ${CTF_FLAG_BROKEN_OBJECT_LEVEL_AUTHORIZATION:-}
      CTF_FLAG_BROKEN_FUNCTION_LEVEL_AUTHORIZATION: ${CTF_FLAG_BROKEN_FUNCTION_LEVEL_AUTHORIZATION:-}
      CTF_FLAG_SECOND_ORDER_SQL_INJECTION: ${CTF_FLAG_SECOND_ORDER_SQL_INJECTION:-}
      CTF_FLAG_PLAINTEXT_PASSWORD_IN_LOGS: ${CTF_FLAG_PLAINTEXT_PASSWORD_IN_LOGS:-}
      CTF_FLAG_XXE_SUPPLIER_ORDER_IMPORT: ${CTF_FLAG_XXE_SUPPLIER_ORDER_IMPORT:-}
      CTF_FLAG_INSECURE_PASSWORD_RESET: ${CTF_FLAG_INSECURE_PASSWORD_RESET:-}
      CTF_FLAG_OPEN_REDIRECT: ${CTF_FLAG_OPEN_REDIRECT:-}
      CTF_FLAG_SELF_XSS_PROFILE_INJECTION: ${CTF_FLAG_SELF_XSS_PROFILE_INJECTION:-}
      CTF_FLAG_CSRF_PROFILE_TAKEOVER_CHAIN: ${CTF_FLAG_CSRF_PROFILE_TAKEOVER_CHAIN:-}
      CTF_FLAG_AES_CBC_PADDING_ORACLE: ${CTF_FLAG_AES_CBC_PADDING_ORACLE:-}
      CTF_FLAG_MCP_MALICIOUS_SERVER: ${CTF_FLAG_MCP_MALICIOUS_SERVER:-}
      CTF_FLAG_MIDDLEWARE_AUTHORIZATION_BYPASS: ${CTF_FLAG_MIDDLEWARE_AUTHORIZATION_BYPASS:-}
