      CTF_FLAG_CROSS_SITE_REQUEST_FORGERY: ${CTF_FLAG_CROSS_SITE_REQUEST_FORGERY:-}
      CTF_FLAG_MASS_ASSIGNMENT: ${CTF_FLAG_MASS_ASSIGNMENT:-}
      CTF_FLAG_PATH_TRAVERSAL: ${CTF_FLAG_PATH_TRAVERSAL:-}
      CTF_FLAG_SERVER_SIDE_REQUEST_FORGERY: ${CTF_FLAG_SERVER_SIDE_REQUEST_FORGERY:-}
      CTF_FLAG_SQL_INJECTION: ${CTF_FLAG_SQL_INJECTION:-}
      CTF_FLAG_INFORMATION_DISCLOSURE_API_ERROR: ${CTF_FLAG_INFORMATION_DISCLOSURE_API_ERROR:-}
      CTF_FLAG_MALICIOUS_FILE_UPLOAD: ${CTF_FLAG_MALICIOUS_FILE_UPLOAD:-}
      CTF_FLAG_PRODUCT_SEARCH_SQL_INJECTION: ${CTF_FLAG_PRODUCT_SEARCH_SQL_INJECTION:-}
      CTF_FLAG_SESSION_FIXATION_WEAK_SESSION_MANAGEMENT: ${CTF_FLAG_SESSION_FIXATION_WEAK_SESSION_MANAGEMENT:-}
      CTF_FLAG_BRUTE_FORCE_NO_RATE_LIMITING: ${CTF_FLAG_BRUTE_FORCE_NO_RATE_LIMITING:-}
      CTF_FLAG_X_FORWARDED_FOR_SQL_INJECTION: ${CTF_FLAG_X_FORWARDED_FOR_SQL_INJECTION:-}
      CTF_FLAG_PROMPT_INJECTION_AI_ASSISTANT: ${CTF_FLAG_PROMPT_INJECTION_AI_ASSISTANT:-}
      CTF_FLAG_BROKEN_OBJECT_LEVEL_AUTHORIZATION: ${CTF_FLAG_BROKEN_OBJECT_LEVEL_AUTHORIZATION:-}
